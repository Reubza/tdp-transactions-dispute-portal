name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/UnitTests --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage"
      - name: Integration tests (Testcontainers PostgreSQL)
        run: dotnet test tests/IntegrationTests --no-build --configuration Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: tests/**/TestResults/

  frontend:
    name: Frontend (format + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dispute-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
